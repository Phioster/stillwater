name: APK bauen

on:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android-Werkzeuge einrichten
        run: |
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"

      - name: Godot und Export-Vorlagen holen
        run: |
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates "~/.local/share/godot/export_templates/${GODOT_VERSION}.stable" || \
            mv templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      # Ein bei jedem Lauf neu erzeugter Schluessel gibt jeder APK eine andere
      # Signatur -- dann muss vor jeder Installation deinstalliert werden, und
      # der Spielstand ist weg. Der feste Schluessel liegt als Secret; ohne
      # Secret (Fork, fremder Pull Request) wird weiterhin einer erzeugt, damit
      # der Build trotzdem durchlaeuft.
      - name: Signaturschluessel bereitstellen
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.STILLWATER_KEYSTORE_B64 }}
          KEYSTORE_ALIAS: ${{ secrets.STILLWATER_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.STILLWATER_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > signing.keystore
            echo "alias=$KEYSTORE_ALIAS" >> "$GITHUB_OUTPUT"
            echo "password=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "Fester Schluessel aus dem Secret."
          else
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -keystore signing.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
            echo "alias=androiddebugkey" >> "$GITHUB_OUTPUT"
            echo "password=android" >> "$GITHUB_OUTPUT"
            echo "Kein Secret gefunden -- Wegwerf-Schluessel erzeugt."
          fi

      - name: Exportieren
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/signing.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ${{ steps.signing.outputs.alias }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ steps.signing.outputs.password }}
        run: |
          godot --headless --import --quit-after 2000 || true
          mkdir -p build
          godot --headless --export-debug "Android" build/stillwater-debug.apk
          ls -la build/

      - uses: actions/upload-artifact@v4
        with:
          name: stillwater-debug-apk
          path: build/stillwater-debug.apk
          retention-days: 7
