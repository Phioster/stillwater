name: APK bauen

on:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 versuchte hier zusaetzlich ein von
      # Google entferntes Legacy-Paket ("tools") zu installieren und brach
      # deshalb ab. Der Runner bringt das SDK unter /usr/local/lib/android/sdk
      # aber schon fertig mit -- nur eben nicht auf dem PATH. Das holt dieser
      # Schritt selbst nach, ohne die kaputte Aktion.
      - name: Android-SDK-Pfad setzen
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          dirname "$(find /usr/local/lib/android/sdk/cmdline-tools \
            -maxdepth 2 -name sdkmanager | head -n1)" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Android-Werkzeuge einrichten
        run: |
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"

      - name: Godot und Export-Vorlagen holen
        run: |
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates "~/.local/share/godot/export_templates/${GODOT_VERSION}.stable" || \
            mv templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      # Die CI signiert NUR mit einem Wegwerf-Schluessel. Der echte
      # Signaturschluessel verlaesst das Geraet des Entwicklers nicht -- die
      # fertige APK wird lokal mit tools/sign.sh nachsigniert.
      - name: Wegwerf-Schluessel erzeugen
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore signing.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Exportieren
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/signing.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          godot --headless --import --quit-after 2000 || true
          mkdir -p build
          godot --headless --export-debug "Android" build/stillwater-debug.apk
          ls -la build/

      - uses: actions/upload-artifact@v4
        with:
          name: stillwater-debug-apk
          path: build/stillwater-debug.apk
          retention-days: 7
