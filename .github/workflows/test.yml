name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  ## Die Python-Tests unter tools/tests/ schneiden Bilder und brauchen dafuer
  ## Pillow; tools/wurf_lauf.py, rotsprite.py, arm_schwenken.py und
  ## rute_anheften.py vergleichen Bilder als Array und brauchen numpy.
  ## Beide festgenagelt wie die Godot-Version: sonst entscheidet der Tag, an
  ## dem die CI laeuft, mit welcher Fassung geprueft wird.
  PILLOW_VERSION: 12.3.0
  NUMPY_VERSION: 2.4.4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot holen
        run: |
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --headless --version

      - name: Ressourcen importieren
        run: godot --headless --import --quit-after 2000 || true

      - name: Pillow und numpy holen
        run: |
          pip install --quiet "pillow==${PILLOW_VERSION}" "numpy==${NUMPY_VERSION}"
          python3 -c "import PIL; print('Pillow', PIL.__version__)"
          python3 -c "import numpy; print('numpy', numpy.__version__)"

      - name: Inhalte prüfen und Tests laufen lassen
        run: bash tools/test.sh
